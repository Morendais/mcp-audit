name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          platforms=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64" "windows/arm64")
          version="${GITHUB_REF_NAME}"

          for platform in "${platforms[@]}"; do
            platform_split=(${platform//\// })
            GOOS=${platform_split[0]}
            GOARCH=${platform_split[1]}
            output_name="mcpaudit"
            ext=""
            if [ "$GOOS" = "windows" ]; then
              output_name="mcpaudit.exe"
              ext=".zip"
            else
              ext=".tar.gz"
            fi

            target_dir="dist/${GOOS}_${GOARCH}"
            mkdir -p "$target_dir"
            echo "Building for $GOOS/$GOARCH..."
            env GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags="-s -w -X 'mcpaudit/cmd.version=${version}'" -o "$target_dir/$output_name" .

            archive_name="mcpaudit_${version}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              (cd "$target_dir" && zip "../../dist/${archive_name}.zip" "$output_name")
            else
              (cd "$target_dir" && tar -czf "../../dist/${archive_name}.tar.gz" "$output_name")
            fi
          done

          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt || shasum -a 256 *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
